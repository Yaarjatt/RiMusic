workflows:
  rimusic-android:
    name: RiMusic Android APK (release)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 21
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.konan
        - $HOME/.m2
    scripts:
      - name: Accept Android licenses + install SDK 35
        script: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null 2>&1 || true
      - name: Make gradlew executable
        script: chmod +x gradlew
      - name: Clean
        script: ./gradlew clean
      - name: Build full-release APK (debug-signed, installable)
        script: ./gradlew :composeApp:assembleFullRelease
    artifacts:
      - composeApp/build/outputs/apk/full/release/*.apk
