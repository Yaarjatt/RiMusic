workflows:
  rimusic-android:
    name: RiMusic Android APK
    instance_type: mac_studio_m2
    max_build_duration: 60
    environment:
      java: 21
      android_sdk: 35
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.konan
        - $HOME/.m2
    scripts:
      - name: Accept Android licenses
        script: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null 2>&1 || true
      - name: Make gradlew executable
        script: chmod +x gradlew
      - name: Clean
        script: ./gradlew clean
      - name: Build debug APK
        script: ./gradlew :composeApp:assembleDebug
    artifacts:
      - composeApp/build/outputs/apk/**/*.apk
    publishing:
      email:
        recipients: []
        notify:
          success: true
          failure: true
